<!DOCTYPE html>
<html>

<head>
    <title>Cybersecurity Quiz</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body{
            background:#020d31;
            font-family: Arial, sans-serif;
        }

        .quiz-container{
            max-width: 900px;
            margin: 40px auto;
            background: #e4e8f0;
            padding: 30px;
            border-radius: 12px;
            color: #111;
        }

        .quiz-container h1{
            text-align:center;
            color:#1a1774;
            margin-bottom:30px;
        }

        .question-box{
            background:white;
            padding:20px;
            margin-bottom:20px;
            border-radius:10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .question-box h3{
            color:#1a1774;
            margin-bottom:15px;
        }

        .option{
            margin:10px 0;
            padding:8px;
            border-radius:6px;
        }

        .option:hover{
            background:#f1f5ff;
        }

        .submit-btn{
            background:#1a1774;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        .submit-btn:hover{
            background:#2b2aa0;
        }

        .score-box{
            margin-top:25px;
            padding:20px;
            background:#1a1774;
            color:white;
            border-radius:10px;
            text-align:center;
            font-size:22px;
        }

        .back-btn{
            display:inline-block;
            margin-bottom:20px;
            text-decoration:none;
            background:#1a1774;
            color:white;
            padding:10px 18px;
            border-radius:8px;
        }

        .back-btn:hover{
            background:#2b2aa0;
        }

    </style>
</head>

<body>

<div class="quiz-container">

    <a href="/user" class="back-btn">⬅ Back to Dashboard</a>

    <h1>🧠 Cybersecurity Quiz</h1>

    <form method="POST">

        {% for q in questions %}

        <div class="question-box">

            <h3>{{ loop.index }}. {{ q.q }}</h3>

            {% set question_no = loop.index %}

            {% for option in q.options %}

            <div class="option">

                <input type="radio"
                       name="question{{ question_no }}"
                       id="q{{ question_no }}_{{ loop.index }}"
                       value="{{ loop.index0 }}">

                <label for="q{{ question_no }}_{{ loop.index }}">
                    {{ option }}
                </label>

            </div>

            {% endfor %}

        </div>

        {% endfor %}

        <button type="submit" class="submit-btn">
            Submit Quiz
        </button>

    </form>

    {% if score is not none %}

    <div class="score-box">

        ✅ Your Score: {{ score }} / {{ questions|length }}

    </div>

    {% endif %}

</div>

</body>
</html>

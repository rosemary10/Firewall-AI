<!DOCTYPE html>
<html>

<head>

    <title>Blocked IPs</title>

    <style>

        body {
            background-color: #0f1117;
            color: #00ff88;
            font-family: Arial;
            padding: 20px;
        }

        h1 {
            color: red;
        }

        table {
            width: 50%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #1c1f26;
        }

        th, td {
            border: 1px solid #333;
            padding: 12px;
        }

        th {
            background-color: #111827;
        }

    </style>

</head>

<body>

    <h1>Blocked IP Addresses</h1>

    <table>

        <tr>
            <th>IP Address</th>
        </tr>

        {% for ip in ips %}

        <tr>
            <td>{{ ip.source_ip }}</td>
        </tr>

        {% endfor %}

    </table>

</body>

</html>

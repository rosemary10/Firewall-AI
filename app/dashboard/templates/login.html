<!DOCTYPE html>
<html>

<head>

    <title>Secure Login - AI Firewall</title>

    <style>

        body {
            background-color: #0f1117;
            color: #00ff88;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background-color: #1c1f26;
            padding: 40px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
        }

        h1 {
            text-align: center;
            color: #ff3333;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 20px;
            background-color: #111827;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #00ff88;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #00cc6e;
        }

        .error {
            color: red;
            margin-bottom: 15px;
            text-align: center;
        }

        .rules {
            color: #aaa;
            font-size: 14px;
            margin-top: 15px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>AI FIREWALL LOGIN</h1>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                LOGIN
            </button>

<p style="text-align:center; margin-top:15px;">
    Don't have an account?
    <a href="/register">Register</a>
</p>

        </form>

        <div class="rules">
            Password must contain:
            <ul>
                <li>Minimum 8 characters</li>
                <li>Uppercase letter</li>
                <li>Lowercase letter</li>
                <li>Number</li>
                <li>Special character</li>
            </ul>
        </div>

    </div>

</body>

</html>

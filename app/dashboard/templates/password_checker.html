<!DOCTYPE html>
<html>

<head>
    <title>Password Strength Checker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .checker-box{
            max-width:600px;
            margin:60px auto;
            background:#e4e8f0;
            padding:30px;
            border-radius:12px;
            color:#111;
            text-align:center;
        }

        .checker-box h1{
            color:#1a1774;
        }

        input{
            width:90%;
            padding:12px;
            margin-top:20px;
            border-radius:8px;
            border:none;
        }

        button{
            margin-top:20px;
            padding:12px 25px;
            background:#1a1774;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        .result{
            margin-top:25px;
            padding:20px;
            background:white;
            border-radius:10px;
            font-size:22px;
        }

        .back-btn{
        display:inline-block;
        margin-bottom:20px;
        text-decoration:none;
        background:#1a1774;
        color:white;
        padding:10px 18px;
        border-radius:8px;
    }

        .back-btn:hover{
        background:#2b2aa0;
    }

    </style>
</head>

<body>

<div class="checker-box">

    <a href="/user" class="back-btn">⬅ Back to Dashboard</a>

    <h1>🔐 Password Strength Checker</h1>

    <form method="POST">

        <input type="text"
               name="password"
               placeholder="Enter password">

        <br>

        <button type="submit">
            Check Strength
        </button>

    </form>

    {% if strength %}

    <div class="result">
        {{ strength }}
    </div>

    {% endif %}

</div>

</body>
</html>
